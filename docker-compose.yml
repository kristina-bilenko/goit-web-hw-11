services:
  db:
    image: postgres:16
    container_name: fastapi_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - fastapi_postgres_data:/var/lib/postgresql/data

volumes:
  fastapi_postgres_data: